<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QueueFlow Staff Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login-screen">
  <form id="login-form">
    <a href="/" class="back-link">← Home</a>
    <h1>QueueFlow</h1>
    <p class="subtitle">Staff sign-in</p>
    <label>Contact
      <input type="text" id="login-contact" required autocomplete="username">
    </label>
    <label>Password
      <input type="password" id="login-password" required autocomplete="current-password">
    </label>
    <button type="submit">Sign in</button>
    <p id="login-error" class="error"></p>
    <p class="switch-link">New clinic? <a href="/signup/">Sign up</a></p>
  </form>
</div>

<div id="dashboard-screen" class="hidden">
  <header>
    <div>
      <strong id="clinic-role"></strong>
      <span id="session-status" class="badge"></span>
    </div>
    <div>
      <button id="pause-resume-btn" class="hidden secondary">Pause queue</button>
      <button id="close-reopen-btn" class="hidden secondary">Close for today</button>
      <button id="logout-btn" class="secondary">Log out</button>
    </div>
  </header>

  <p class="clinic-info">
    Clinic ID: <code id="clinic-id-display"></code>
    <a id="open-patient-app-link" href="#" target="_blank" rel="noopener" class="link-btn">Open patient app</a>
    <button id="copy-patient-link-btn" class="link-btn">Copy patient link</button>
    <span id="copy-confirm" class="copy-confirm hidden">Copied!</span>
  </p>

  <p id="banner" class="banner hidden"></p>

  <section class="called-section">
    <h2>Currently called</h2>
    <div id="called-list" class="token-list"></div>
    <button id="call-next-btn">Call next patient</button>
  </section>

  <section class="actions-section">
    <div class="card">
      <h3>Add walk-in</h3>
      <form id="walkin-form">
        <select id="walkin-contact-type">
          <option value="telegram">Telegram</option>
          <option value="email">Email</option>
        </select>
        <input type="text" id="walkin-contact-value" placeholder="Contact value" required>
        <input type="email" id="walkin-email" placeholder="Fallback email (optional)">
        <select id="walkin-tier">
          <option value="standard">Standard</option>
          <option value="priority">Priority</option>
        </select>
        <button type="submit">Add to queue</button>
      </form>
    </div>

    <div id="override-card" class="card hidden">
      <h3>Emergency override</h3>
      <form id="override-form">
        <select id="override-contact-type">
          <option value="telegram">Telegram</option>
          <option value="email">Email</option>
        </select>
        <input type="text" id="override-contact-value" placeholder="Contact value" required>
        <button type="submit" class="danger">Insert emergency</button>
      </form>
    </div>

    <div class="card">
      <h3>Fees (₹)</h3>
      <form id="fees-form">
        <label>Standard <input type="number" id="fee-standard" min="0" step="0.01" required></label>
        <label>Priority <input type="number" id="fee-priority" min="0" step="0.01" required></label>
        <label>Emergency <input type="number" id="fee-emergency" min="0" step="0.01" required></label>
        <button type="submit">Save fees</button>
        <span id="fees-saved" class="copy-confirm hidden">Saved!</span>
      </form>
    </div>
  </section>

  <section class="waiting-section">
    <h2>Waiting</h2>
    <table id="waiting-table">
      <thead>
        <tr><th>Up next</th><th>Token</th><th>Tier</th><th>Contact</th><th>Joined</th><th></th></tr>
      </thead>
      <tbody id="waiting-body"></tbody>
    </table>
  </section>

  <section class="served-section">
    <h2>Served today <span id="served-totals" class="totals-line"></span></h2>
    <table id="served-table">
      <thead>
        <tr><th>Token</th><th>Tier</th><th>Contact</th><th>Served at</th><th>Payment</th></tr>
      </thead>
      <tbody id="served-body"></tbody>
    </table>
  </section>
</div>

<script src="app.js"></script>
</body>
</html>
