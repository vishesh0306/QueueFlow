services:
  - type: web
    name: queueflow-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: queueflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: queueflow-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      # Render's free plan has no Background Worker service type at all -- this makes
      # the API process also run worker.py's and telegram_bot.py's loops as daemon
      # threads (see config.py). Leave unset (or false) on any deploy that runs them
      # as real separate services instead, e.g. docker-compose.prod.yml.
      - key: RUN_BACKGROUND_WORKERS_IN_PROCESS
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_ADDRESS
        sync: false

  - type: redis
    name: queueflow-redis
    plan: free
    ipAllowList: []

databases:
  - name: queueflow-db
    plan: free
