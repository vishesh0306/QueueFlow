services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: queueflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: queueflow
    volumes: ["pgdata:/var/lib/postgresql/data"]
    restart: unless-stopped
    # No port mapping -- only reachable from other containers on the compose network,
    # never directly from the internet, unlike the local dev compose file.

  redis:
    image: redis:7
    volumes: ["redisdata:/data"]
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on: [postgres, redis]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://queueflow:${POSTGRES_PASSWORD}@postgres:5432/queueflow
      REDIS_URL: redis://redis:6379/0
    restart: unless-stopped
    # No port mapping -- Caddy is the only thing that talks to this from outside.

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on: [postgres, redis]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://queueflow:${POSTGRES_PASSWORD}@postgres:5432/queueflow
      REDIS_URL: redis://redis:6379/0
    restart: unless-stopped

  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["python", "telegram_bot.py"]
    depends_on: [postgres]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://queueflow:${POSTGRES_PASSWORD}@postgres:5432/queueflow
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    env_file: .env
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
